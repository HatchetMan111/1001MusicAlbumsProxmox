<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#12141a">
  <meta name="description" content="Lokale Checkliste zu 1001 Albums You Must Hear Before You Die – vollständig offline, keine Cloud.">
  <title>{% block title %}AlbumsDashboard{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v=4">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Albums">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">🎧 AlbumsDashboard</a>
    <nav class="mainnav" aria-label="Hauptnavigation">
      <a href="/" class="navlink {% if not request.url.path.startswith('/gehoert') %}active{% endif %}">Alle Alben</a>
      <a href="/gehoert" class="navlink {% if request.url.path.startswith('/gehoert') %}active{% endif %}">Gehörte Alben</a>
    </nav>
    <span class="tagline">1001 Alben, die man gehört haben sollte</span>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <span>Vollständig lokal &amp; offline – keine Cloud, kein externer Dienst.</span>
  </footer>
  <script src="/static/app.js?v=4" defer></script>
</body>
</html>
