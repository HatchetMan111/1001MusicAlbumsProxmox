<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}AlbumsDashboard{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">🎧 AlbumsDashboard</a>
    <nav class="mainnav" aria-label="Hauptnavigation">
      <a href="/" class="navlink {% if not request.url.path.startswith('/gehoert') %}active{% endif %}">Alle Alben</a>
      <a href="/gehoert" class="navlink {% if request.url.path.startswith('/gehoert') %}active{% endif %}">Gehörte Alben</a>
    </nav>
    <span class="tagline">1001 Alben, die man gehört haben sollte</span>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <span>Vollständig lokal &amp; offline – keine Cloud, kein externer Dienst.</span>
  </footer>
  <script src="/static/app.js?v=2" defer></script>
</body>
</html>
